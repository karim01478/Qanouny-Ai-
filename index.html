<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد القانوني المغربي الذكي</title>
    <!-- إضافة خط عربي احترافي من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #c0392b;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --white: #ffffff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            background: var(--white);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 2rem;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .btn {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(44, 62, 80, 0.3);
        }

        .btn:hover {
            background-color: var(--accent-color);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(192, 57, 43, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        footer {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>المساعد القانوني المغربي الذكي</h1>
        <p>منصتك المتكاملة للاستشارات القانونية والبحث في القوانين المغربية بكل سهولة.</p>
        
        <button class="btn" onclick="showComingSoon()">
            تحميل التطبيق الآن
        </button>

        <footer>
            &copy; 2024 المساعد القانوني المغربي. جميع الحقوق محفوظة.
        </footer>
    </div>

    <script>
        function showComingSoon() {
            alert('شكراً لاهتمامكم! التطبيق سيكون متاحاً للتحميل قريباً على App Store و Google Play.');
        }
    </script>

</body>
</html>
