<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qanoun AI</title>

<style>
body {
  font-family: Arial;
  background: #0a192f;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  width: 100%;
  max-width: 500px;
  background: #112240;
  padding: 15px;
  border-radius: 10px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
}

button {
  background: gold;
  cursor: pointer;
}

#chat {
  height: 300px;
  overflow-y: auto;
  margin-top: 10px;
  background: #020c1b;
  padding: 10px;
  border-radius: 10px;
}

/* ✅ UI جديد */
.msg {
  padding: 8px;
  border-radius: 8px;
  margin: 5px;
}

.user {
  background: #1e90ff;
  text-align: right;
}

.bot {
  background: #333;
  text-align: left;
}
</style>
</head>

<body>

<div class="container">

<h3>⚖️ Qanoun AI</h3>

<input id="apiKeyInput" placeholder="دخل Groq API Key">
<button onclick="saveKey()">حفظ المفتاح</button>

<div id="chat"></div>

<input id="userInput" placeholder="كتب سؤالك">
<button onclick="sendMessage()">إرسال</button>

</div>

<script>

let apiKey = localStorage.getItem("groq_key") || "";
let history = [];

/* ✅ حفظ المفتاح */
function saveKey() {
  const input = document.getElementById("apiKeyInput");
  apiKey = input.value.trim();
  localStorage.setItem("groq_key", apiKey);
  alert("تم حفظ المفتاح");
}

/* ✅ عرض الرسائل */
function addMessage(text, role) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerText = text;
  document.getElementById("chat").appendChild(div);
}

/* ✅ إرسال السؤال */
async function sendMessage() {

  if (!apiKey) {
    alert("دخل API Key");
    return;
  }

  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;

  input.value = "";

  addMessage(text, "user");
  history.push({ role: "user", content: text });

  /* typing */
  const typing = document.createElement("div");
  typing.className = "msg bot";
  typing.innerText = "... جاري التفكير";
  document.getElementById("chat").appendChild(typing);

  try {

    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + apiKey
      },
      body: JSON.stringify({
        model: "llama-3.3-70b-versatile",

        /* ✅ SYSTEM PROMPT */
        messages: [
          {
            role: "system",
            content: `
أنت مستشار قانوني مغربي محترف.

القواعد:
- تعتمد فقط على القانون المغربي
- تشرح بطريقة مبسطة وواضحة
- تعطي خطوات عملية (ماذا يفعل الشخص)
- إذا كان هناك شك، قل "يفضل استشارة محام"
- لا تخترع قوانين
- نظم الجواب: تعريف → حكم قانوني → ماذا تفعل
`
          },
          ...history
        ]
      })
    });

    const data = await res.json();

    typing.remove();

    if (data.error) {
      addMessage("خطأ: " + data.error.message, "bot");
      return;
    }

    const reply = data.choices[0].message.content;
    addMessage(reply, "bot");

    history.push({ role: "assistant", content: reply });

  } catch (e) {
    typing.remove();
    addMessage("خطأ في الاتصال", "bot");
  }
}

</script>

</body>
</html>
