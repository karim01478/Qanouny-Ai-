<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qanoun AI</title>

<style>
body {
  margin: 0;
  font-family: 'Arial';
  background: #0f172a;
  color: white;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 10px;
}

.title {
  text-align: center;
  font-size: 22px;
  margin-bottom: 10px;
}

.chat {
  height: 400px;
  overflow-y: auto;
  background: #1e293b;
  padding: 10px;
  border-radius: 10px;
}

.msg {
  padding: 10px 14px;
  border-radius: 15px;
  margin: 6px 0;
  max-width: 80%;
  line-height: 1.6;
}

.user {
  background: #1e90ff;
  margin-left: auto;
}

.bot {
  background: #334155;
  margin-right: auto;
}

.input-box {
  display: flex;
  margin-top: 10px;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 10px;
  margin-right: 5px;
  background: gold;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
  <div class="title">Qanoun AI ⚖️</div>

  <div id="chat" class="chat"></div>

  <div class="input-box">
    <input id="userInput" placeholder="اكتب سؤالك القانوني..." />
    <button onclick="sendMessage()">إرسال</button>
  </div>
</div>

<script>
let history = [];

function addMessage(text, role) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerText = text;

  const chat = document.getElementById("chat");
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addTyping() {
  addMessage("⏳ جاري الكتابة...", "bot");
}

function removeTyping() {
  const chat = document.getElementById("chat");
  if (chat.lastChild) chat.removeChild(chat.lastChild);
}

async function sendMessage() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;

  input.value = "";
  addMessage(text, "user");

  history.push({ role: "user", content: text });

  addTyping();

  try {
    const res = await fetch("http://localhost:3000/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: "llama-3.3-70b-versatile",
        messages: [
          {
            role: "system",
            content: `
أنت مستشار قانوني مغربي محترف.

القواعد:
- تعتمد فقط على القانون المغربي
- لا تخترع قوانين
- اشرح بطريقة بسيطة

نظم الجواب:
1. التعريف
2. الحكم القانوني
3. ماذا يفعل الشخص
`
          },
          ...history
        ],
        temperature: 0.4,
        max_tokens: 1024
      })
    });

    const data = await res.json();

    removeTyping();

    const reply = data.choices?.[0]?.message?.content || "خطأ";

    addMessage(reply, "bot");

    history.push({ role: "assistant", content: reply });

  } catch (e) {
    removeTyping();
    addMessage("❌ خطأ في الاتصال بالسيرفر", "bot");
  }
}
</script>

</body>
</html>
